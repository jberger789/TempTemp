name: Autograde

on:
  push:
    tags: ["spec-v1", "spec-v2", "implementation", "reflection", "submit/*"]

jobs:
  grade:
    uses: "gw-computer-networks-f26/classroom50/.github/workflows/autograde-runner.yaml@main"
    permissions:
      contents: write
      statuses: write
      # Lets the runner open the opt-in Feedback PR. A reusable
      # workflow's token is the intersection with the caller's grants, so
      # this must mirror autograde-runner.yaml's permissions.
      pull-requests: write
